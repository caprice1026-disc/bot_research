[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc5m-research"
version = "0.1.0"
description = "Public-data research tools for Polymarket BTC 5m markets"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
btc5m = "btc5m.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
