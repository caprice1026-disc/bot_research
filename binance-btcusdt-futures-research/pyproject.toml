[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-regime-eda"
version = "0.1.0"
description = "Research-grade BTCUSDT futures EDA and walk-forward regime analysis"
requires-python = ">=3.13"
dependencies = [
  "hmmlearn>=0.3.3,<0.4",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "pillow>=10,<13",
  "ruptures>=1.1.9,<2",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
  "threadpoolctl>=3.5,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
