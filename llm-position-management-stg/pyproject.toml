[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-position-management-stg"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests>=2.32,<3", "google-genai>=1,<2", "google-cloud-firestore>=2.19,<3", "google-cloud-storage>=3,<4", "hyperliquid-python-sdk>=0.20,<1", "gunicorn>=23,<24; sys_platform != 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
position-stg = "position_stg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
