[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base-uniswap-v3-lp-research"
version = "0.1.0"
description = "Reproducible event-driven research for Base Uniswap v3 concentrated liquidity"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
  "eth-hash[pycryptodome]>=0.7,<1",
  "pyarrow>=17,<22",
  "PyYAML>=6,<7",
  "numpy>=2,<3",
  "pandas>=2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "hypothesis>=6,<7",
]

[project.scripts]
base-lp = "base_lp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -p no:cacheprovider"
