name: Position STG
on:
  pull_request:
    paths: ['llm-position-management-stg/**', '.github/workflows/position-stg.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy shadow service after tests
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install './llm-position-management-stg[test]'
      - run: python -m pytest llm-position-management-stg/tests -q
      - run: position-stg --sqlite '${{ runner.temp }}/fixture.db' fixture
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: test
    runs-on: ubuntu-latest
    environment: stg
    concurrency:
      group: position-stg-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: asia-northeast1
      SERVICE: position-stg
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      SCHEDULER_SA: ${{ vars.GCP_SCHEDULER_SA }}
      BOT_ID: ${{ vars.BOT_ID || 'btc-shadow-v1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy private shadow service
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" && test -n "$RUNTIME_SA" && test -n "$SCHEDULER_SA"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/position-stg/app:$GITHUB_SHA"
          gcloud builds submit llm-position-management-stg --project "$PROJECT_ID" --tag "$IMAGE"
          gcloud run deploy "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SA" --no-allow-unauthenticated \
            --min-instances 0 --max-instances 1 --concurrency 1 --cpu 1 --memory 512Mi \
            --timeout 290 --cpu-throttling \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=$PROJECT_ID,CODE_COMMIT=$GITHUB_SHA,BOT_ID=$BOT_ID" \
            --update-secrets 'GEMINI_API_KEY=gemini-api-key:latest,DISCORD_WEBHOOK_URL=discord-webhook:latest'
          gcloud run services add-iam-policy-binding "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --member "serviceAccount:$SCHEDULER_SA" --role roles/run.invoker
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')
          ARGS=(--project "$PROJECT_ID" --location "$REGION" --schedule '*/5 * * * *' \
            --time-zone Asia/Tokyo --uri "$URL/tick" --http-method POST \
            --oidc-service-account-email "$SCHEDULER_SA" --oidc-token-audience "$URL" \
            --attempt-deadline 300s --max-retry-attempts 0)
          if gcloud scheduler jobs describe position-stg-tick --project "$PROJECT_ID" --location "$REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http position-stg-tick "${ARGS[@]}"
          else
            gcloud scheduler jobs create http position-stg-tick "${ARGS[@]}"
          fi
